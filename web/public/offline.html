<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#121D2B" />
    <title>مَشهد — بلا اتصال</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #121d2b; color: #edf4f2; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; text-align: center; }
      main { max-width: 30rem; }
      .mark { width: 72px; height: 72px; margin: 0 auto 22px; display: grid; place-items: center; border: 1px solid #354a5d; border-radius: 24px; color: #92decc; font-size: 34px; }
      h1 { margin: 0 0 12px; font-size: 24px; }
      p { margin: 0; color: #a7b7c3; line-height: 1.8; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">▶</div>
      <h1>أنت غير متصل بالإنترنت</h1>
      <p>اتصل بالإنترنت ثم أعد المحاولة لاكتشاف العناوين ومشاهدة التفاصيل.</p>
    </main>
  </body>
</html>
